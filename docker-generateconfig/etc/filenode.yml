s3Store:
    bucket: %S3_BUCKET%
    indexBucket: %S3_BUCKET%
    maxThreads: 16
    profile: default
    region: %S3_REGION%
    endpoint: %S3_ENDPOINT%
    forcePathStyle: true # 'true' for self-hosted S3 Object Storage

redis:
    isCluster: false
    url: %REDIS_URL%

drpc:
  stream:
    timeoutMilliseconds: 1000
    maxMsgSizeMb: 256

yamux:
    listenAddrs:
        - %ANY_SYNC_FILENODE_ADDRESSES%
    writeTimeoutSec: 10
    dialTimeoutSec: 10

quic:
    listenAddrs:
        - %ANY_SYNC_FILENODE_QUIC_ADDRESSES%
    writeTimeoutSec: 10
    dialTimeoutSec: 10

defaultLimit: %ANY_SYNC_FILENODE_DEFAULT_LIMIT%
