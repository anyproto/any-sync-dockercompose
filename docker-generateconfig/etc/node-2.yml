apiServer:
    listenAddr: 0.0.0.0:8080

drpc:
  stream:
    timeoutMilliseconds: 1000
    maxMsgSizeMb: 256

yamux:
    listenAddrs:
        - %ANY_SYNC_NODE_2_ADDRESSES%
    writeTimeoutSec: 10
    dialTimeoutSec: 10
quic:
    listenAddrs:
        - %ANY_SYNC_NODE_2_QUIC_ADDRESSES%
    writeTimeoutSec: 10
    dialTimeoutSec: 10

space:
    gcTTL: 60
    syncPeriod: 600

storage:
    path: /storage
    anyStorePath: /anyStorage

nodeSync:
    periodicSyncHours: 2
    syncOnStart: true

s3Store:
    enabled: false
    region: %S3_REGION%
    endpoint: %S3_ENDPOINT%
    bucket: %S3_BUCKET%
    keyPrefix: "node_storage/node-2"
    forcePathStyle: true # 'true' for self-hosted S3 Object Storage

archive:
    enabled: false
    archiveAfterDays: 1
    checkPeriodMinutes: 2
